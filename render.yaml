databases:
  - name: gastrosena-db
    plan: free
    databaseName: gastrosena
    user: gastrosena

services:
  - type: web
    name: gastrosena-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: NODE_ENV=production omitiría tsc y tsx, que el build necesita
    buildCommand: npm ci --include=dev && npm run build
    # En el plan gratuito no hay pre-deploy: las migraciones (idempotentes) corren al arrancar
    startCommand: npm run migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gastrosena-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://burbano52100.github.io
      # Primer encargado (bootstrapAdmin): se configuran a mano en el panel de Render
      - key: ADMIN_DOCUMENT
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Encargado General Comedor
      - key: ADMIN_EMAIL
        sync: false
